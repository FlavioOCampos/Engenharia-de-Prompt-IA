<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Aluno</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      background:#000;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      color:white;
    }

    .container{

      width:420px;

      background:#1e1e1e;

      padding:35px;

      border-radius:20px;
    }

    h1{

      font-size:42px;

      margin-bottom:25px;
    }

    input{

      width:100%;

      padding:15px;

      margin-bottom:15px;

      border:none;

      border-radius:10px;

      background:#2b2b2b;

      color:white;

      font-size:16px;
    }

    button{

      width:100%;

      padding:15px;

      border:none;

      border-radius:10px;

      background:#27c7ae;

      color:white;

      font-size:18px;

      font-weight:bold;

      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    .resultado{

      margin-top:25px;

      padding:20px;

      border-radius:12px;

      background:#11352f;

      line-height:1.8;
    }

    .erro{

      background:#4b1515;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>Aluno</h1>

    <input
      type="text"
      id="nome"
      placeholder="Nome completo"
    >

    <input
      type="text"
      id="matricula"
      placeholder="Matrícula"
    >

    <input
      type="text"
      id="turma"
      placeholder="Turma"
    >

   <button onclick="confirmarPresenca()">

    Confirmar presença

</button>

<button id="btnSair">

    Sair da Aula

</button>

    <div id="resultado"></div>

  </div>

  <script type="module">

   import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    setDoc,
    updateDoc
  
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSyCQXNXC...",
    authDomain: "geopresenceai.firebaseapp.com",
    projectId: "geopresenceai",
    storageBucket: "geopresenceai.firebasestorage.app",
    messagingSenderId: "50359090351",
    appId: "1:50359090351:web:baee622c4487d20147685a"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


    const params = new URLSearchParams(window.location.search);

    const codigo = params.get("codigo");

    async function confirmarPresenca(){

      const nome = document.getElementById("nome").value;

      const matricula = document.getElementById("matricula").value;

      const turma = document.getElementById("turma").value;

      if(!nome || !matricula || !turma){

        alert("Preencha todos os campos");

        return;
      }

      const aulaRef = doc(db, "aulas", codigo);

      const aulaSnap = await getDoc(aulaRef);

      const aula = aulaSnap.data();

if(aula.encerrada){

    alert("Aula encerrada pelo professor");

    return;
}

      if(!aulaSnap.exists()){

        alert("Aula não encontrada");

        return;
      }

      navigator.geolocation.getCurrentPosition(

        async(posicao)=>{

          const latAluno = posicao.coords.latitude;

          const longAluno = posicao.coords.longitude;

          const distancia = calcularDistancia(

            aula.latitude,
            aula.longitude,
            latAluno,
            longAluno
          );

          if(distancia > 50){

            document.getElementById("resultado").innerHTML = `

              <div class="resultado erro">

                ❌ Você está longe da sala

                <br><br>

                Distância:
                ${Math.round(distancia)} metros

              </div>

            `;

            return;
          }

         await setDoc(

    doc(
        db,
        "aulas",
        codigo,
        "presencas",
        matricula
    ),

    {

        nome:nome,

        matricula:matricula,

        turma:turma,

        distancia:Math.round(distancia),

        data:new Date().toLocaleString(),

        status:"Presente"

    }

);

          document.getElementById("resultado").innerHTML = `

            <div class="resultado">

              ✅ Presença confirmada

              <br><br>

              Distância:
              ${Math.round(distancia)} metros

            </div>

          `;

        },

        ()=>{

          alert("Permita acesso à localização");
        }

      );

    }

    function calcularDistancia(lat1, lon1, lat2, lon2){

      const R = 6371e3;

      const rad = Math.PI / 180;

      const a =

        Math.sin((lat2-lat1)*rad/2) *
        Math.sin((lat2-lat1)*rad/2) +

        Math.cos(lat1*rad) *
        Math.cos(lat2*rad) *

        Math.sin((lon2-lon1)*rad/2) *
        Math.sin((lon2-lon1)*rad/2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    window.confirmarPresenca = confirmarPresenca;

  </script>

</body>

</html>
