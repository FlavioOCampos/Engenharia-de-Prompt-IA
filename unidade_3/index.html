<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Presence Checker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #007bff; color: #ffffff; padding: 10px 20px; text-align: center; }
        main { padding: 20px; }
        form { margin-bottom: 20px; }
        input[type='text'], input[type='submit'] { padding: 10px; margin: 5px; width: 200px; }
        footer { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Geolocation Presence Checker</h1>
    </header>
    <main>
        <form id="locationForm">
            <input type="text" id="locationInput" placeholder="Enter your location" required>
            <input type="submit" value="Check Location">
        </form>
        <div id="output"></div>
    </main>
    <footer>
        <p>&copy; 2026 Geolocation Checker</p>
    </footer>
    <script>
        document.getElementById('locationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById('output').innerHTML = "Geolocation is not supported by this browser.";
            }
        });
        function showPosition(position) {
            document.getElementById('output').innerHTML = 'Latitude: ' + position.coords.latitude + '<br>Longitude: ' + position.coords.longitude;
        }
        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    document.getElementById('output').innerHTML = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    document.getElementById('output').innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    document.getElementById('output').innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    document.getElementById('output').innerHTML = "An unknown error occurred.";
                    break;
            }
        }
    </script>
</body>
</html>
