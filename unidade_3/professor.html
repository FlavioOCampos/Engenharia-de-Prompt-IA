<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Professor</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Painel do Professor</h1>

<input type="text" id="materia" placeholder="Digite a matéria">

<button onclick="usarLocalizacao()">
Usar minha localização
</button>

<p id="status"></p>

<div id="linkArea"></div>

<h2>Alunos presentes</h2>

<div id="listaAlunos"></div>

</div>

<script type="module">

import {
  db,
  collection,
  getDocs
} from './firebase.js';

window.usarLocalizacao = function(){

navigator.geolocation.getCurrentPosition((posicao)=>{

const lat = posicao.coords.latitude;
const long = posicao.coords.longitude;

document.getElementById("status").innerHTML = `
Latitude: ${lat}<br>
Longitude: ${long}
`;

const link =
`aluno.html?lat=${lat}&long=${long}`;

document.getElementById("linkArea").innerHTML = `
<a href="${link}" target="_blank">
Abrir página do aluno
</a>

<br><br>

<a href="mapa.html?lat=${lat}&long=${long}" target="_blank">
Abrir mapa da aula
</a>
`;

});

}

async function carregarAlunos(){

const querySnapshot = await getDocs(
collection(db, "presencas")
);

let html = "";

querySnapshot.forEach((doc)=>{

const dados = doc.data();

html += `
<div class="aluno-card">
<h3>${dados.nome}</h3>
<p>${dados.distancia} metros</p>
<p>${dados.data}</p>
</div>
`;

});

document.getElementById("listaAlunos").innerHTML = html;

}

carregarAlunos();

</script>

</body>
</html>
