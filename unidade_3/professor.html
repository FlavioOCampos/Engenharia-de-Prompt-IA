<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Professor</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      background:#000;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      color:white;
    }

    .container{

      width:430px;

      background:#1e1e1e;

      padding:35px;

      border-radius:20px;
    }

    .topo{

      display:flex;

      justify-content:space-between;

      align-items:center;

      margin-bottom:25px;
    }

    h1{
      font-size:48px;
    }

    .contador{

      background:#27c7ae;

      color:black;

      padding:10px 15px;

      border-radius:10px;

      font-weight:bold;
    }

    input{

      width:100%;

      padding:15px;

      border:none;

      border-radius:10px;

      background:#2b2b2b;

      color:white;

      margin-bottom:15px;

      font-size:16px;
    }

    button{

      width:100%;

      padding:15px;

      border:none;

      border-radius:10px;

      background:#27c7ae;

      color:white;

      font-size:18px;

      font-weight:bold;

      cursor:pointer;

      margin-bottom:15px;
    }

    button:hover{
      opacity:0.9;
    }

    .link{

      margin-top:10px;

      background:#111;

      padding:12px;

      border-radius:10px;

      word-break:break-all;

      margin-bottom:15px;

      font-size:14px;
    }

    .presencas{
      margin-top:20px;
    }

    .card{

      background:#2a2a2a;

      padding:18px;

      border-radius:15px;

      margin-bottom:15px;

      border-left:5px solid #27c7ae;
    }

    .card h3{
      margin-bottom:10px;
    }

    .card p{
      margin-bottom:5px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="topo">

      <h1>Professor</h1>

      <div class="contador" id="contador">
        0 alunos
      </div>

    </div>

    <input
      type="text"
      id="materia"
      placeholder="Digite a matéria"
    >

    <button onclick="iniciarAula()">
      Iniciar aula
    </button>

    <div id="areaLink"></div>

    <div class="presencas">

      <h2>Presenças</h2>

      <br>

      <div id="listaPresencas"></div>

    </div>

  </div>

  <script type="module">

    import { db } from "./firebase.js";

    import {

      doc,
      setDoc,
      collection,
      onSnapshot

    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let codigoAtual = "";

    async function iniciarAula(){

      const materia =
      document.getElementById("materia").value;

      if(!materia){

        alert("Digite a matéria");

        return;
      }

      navigator.geolocation.getCurrentPosition(

        async(posicao)=>{

          const codigo =
          gerarCodigo();

          codigoAtual = codigo;

          const latitude =
          posicao.coords.latitude;

          const longitude =
          posicao.coords.longitude;

          await setDoc(

            doc(db, "aulas", codigo),

            {

              materia:materia,

              latitude:latitude,

              longitude:longitude,

              criada:new Date().toLocaleString()

            }

          );

          const linkAluno =
          "https://flavioocampos.github.io/Engenharia-de-Prompt-IA/unidade_3/aluno.html?codigo=" + codigo;

          document.getElementById("areaLink").innerHTML =

          '<div class="link">' +

          linkAluno +

          '</div>' +

          '<button onclick="abrirAluno()">' +

          'Abrir página do aluno' +

          '</button>';

          carregarPresencas();

        },

        ()=>{

          alert("Permita localização");

        }

      );

    }

    function abrirAluno(){

      window.open(

        "https://flavioocampos.github.io/Engenharia-de-Prompt-IA/unidade_3/aluno.html?codigo=" + codigoAtual,

        "_blank"

      );

    }

    function carregarPresencas(){

      onSnapshot(

        collection(db, "aulas", codigoAtual, "presencas"),

        (snapshot)=>{

          const lista =
          document.getElementById("listaPresencas");

          lista.innerHTML = "";

          document.getElementById("contador").innerHTML =

          snapshot.size + " alunos";

          snapshot.forEach((doc)=>{

            const dados = doc.data();

            lista.innerHTML += `

              <div class="card">

                <h3>${dados.nome}</h3>

                <p>Matrícula: ${dados.matricula}</p>

                <p>Turma: ${dados.turma}</p>

                <p>Distância: ${dados.distancia} metros</p>

                <p>${dados.data}</p>

              </div>

            `;

          });

        }

      );

    }

    function gerarCodigo(){

      return Math.random()

      .toString(36)

      .substring(2,10);

    }

    window.iniciarAula = iniciarAula;

    window.abrirAluno = abrirAluno;

  </script>

</body>

</html>
