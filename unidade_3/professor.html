<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Professor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.card{
    width:420px;
    background:#1e1e1e;
    padding:24px;
    border-radius:20px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.badge{
    background:#31c7b7;
    color:black;
    padding:8px 14px;
    border-radius:10px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2b2b2b;
    color:white;
    margin-bottom:14px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#31c7b7;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

#areaLink{
    margin-top:15px;
}

.presenca{
    background:#2b2b2b;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
    border-left:4px solid #31c7b7;
}

.presenca h3{
    margin-bottom:10px;
}

.presenca p{
    margin-bottom:5px;
}

h2{
    margin-top:20px;
}

</style>
</head>

<body>

<div class="card">

    <div class="topo">
        <h1>Professor</h1>
        <div class="badge" id="contador">
            0 alunos
        </div>
    </div>

    <input
        type="text"
        id="materia"
        placeholder="Digite a matéria"
    >

    <button onclick="iniciarAula()">
        Iniciar aula
    </button>

    <div id="areaLink"></div>

    <h2>Presenças</h2>

    <div id="lista"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "SUA_API",

    authDomain: "SEU_AUTH",

    projectId: "SEU_PROJECT",

    storageBucket: "SEU_BUCKET",

    messagingSenderId: "SEU_SENDER",

    appId: "SEU_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.iniciarAula = function(){

    navigator.geolocation.getCurrentPosition(async(posicao)=>{

        const latitude = posicao.coords.latitude;
        const longitude = posicao.coords.longitude;

        const materia =
        document.getElementById("materia").value;

        const codigo =
        Math.random().toString(36).substring(2,7);

        localStorage.setItem("codigoAula", codigo);

        localStorage.setItem("latProfessor", latitude);

        localStorage.setItem("longProfessor", longitude);

        const linkAluno =
        "https://flaviocampos.github.io/Engenharia-de-Prompt-IA/unidade_3/aluno.html?codigo=" + codigo;

        window.linkAluno = linkAluno;

        document.getElementById("areaLink").innerHTML = `

            <button onclick="abrirAluno()">
                Abrir página do aluno
            </button>

            <button onclick="copiarLink()">
                Copiar link
            </button>

        `;

        carregarPresencas();

    });

}

window.abrirAluno = function(){

    window.open(window.linkAluno, "_blank");

}

window.copiarLink = function(){

    navigator.clipboard.writeText(window.linkAluno);

    alert("Link copiado!");

}

function carregarPresencas(){

    onSnapshot(collection(db,"presencas"),(snapshot)=>{

        const lista =
        document.getElementById("lista");

        lista.innerHTML = "";

        document.getElementById("contador")
        .innerHTML =
        snapshot.size + " alunos";

        snapshot.forEach((doc)=>{

            const dados = doc.data();

            lista.innerHTML += `

            <div class="presenca">

                <h3>${dados.nome}</h3>

                <p>
                    Matrícula:
                    ${dados.matricula}
                </p>

                <p>
                    Turma:
                    ${dados.turma}
                </p>

                <p>
                    Distância:
                    ${dados.distancia} metros
                </p>

                <p>
                    ${dados.data}
                </p>

            </div>

            `;

        });

    });

}

</script>

</body>
</html>
