<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Professor</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      background:#000;

      min-height:100vh;

      display:flex;

      justify-content:center;

      align-items:center;

      color:white;
    }

    .container{

      width:500px;

      background:#1e1e1e;

      padding:35px;

      border-radius:20px;
    }

    h1{

      font-size:46px;

      margin-bottom:25px;
    }

    input{

      width:100%;

      padding:15px;

      margin-bottom:15px;

      border:none;

      border-radius:10px;

      background:#2b2b2b;

      color:white;

      font-size:16px;
    }

    button{

      width:100%;

      padding:15px;

      margin-bottom:15px;

      border:none;

      border-radius:10px;

      background:#27c7ae;

      color:white;

      font-size:18px;

      font-weight:bold;

      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    .info{

      margin-top:20px;

      line-height:1.8;
    }

    .codigo{

      background:#111;

      padding:15px;

      border-radius:12px;

      margin-top:20px;

      text-align:center;

      font-size:26px;

      font-weight:bold;

      letter-spacing:3px;

      color:#27c7ae;
    }

    .link{

      margin-top:15px;

      word-break:break-all;
    }

    .link a{

      color:#27c7ae;

      text-decoration:none;
    }

    .card{

      background:#2b2b2b;

      padding:18px;

      border-left:5px solid #27c7ae;

      border-radius:12px;

      margin-top:15px;

      line-height:1.7;
    }

    .topo{

      display:flex;

      justify-content:space-between;

      align-items:center;

      margin-bottom:20px;
    }

    .contador{

      background:#27c7ae;

      color:black;

      padding:8px 14px;

      border-radius:10px;

      font-weight:bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="topo">

      <h1>Professor</h1>

      <div class="contador" id="contador">
        0 alunos
      </div>

    </div>

    <input
      type="text"
      id="materia"
      placeholder="Digite a matéria"
    >

    <button onclick="iniciarAula()">
      Iniciar aula
    </button>

    <div class="info" id="info"></div>

    <div class="codigo" id="codigoAula"></div>

    <div class="link" id="linkAluno"></div>

    <h2 style="margin-top:35px;">
      Presenças
    </h2>

    <div id="lista"></div>

  </div>

  <script type="module">

    import { db } from "./firebase.js";

    import {

      doc,
      setDoc,
      collection,
      addDoc,
      onSnapshot

    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let codigoAtual = "";

    let latitudeProfessor = 0;

    let longitudeProfessor = 0;

    function gerarCodigo(){

      return Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();
    }

    async function iniciarAula(){

      const materia = document.getElementById("materia").value;

      if(!materia){

        alert("Digite a matéria");

        return;
      }

      navigator.geolocation.getCurrentPosition(

        async(posicao)=>{

          latitudeProfessor = posicao.coords.latitude;

          longitudeProfessor = posicao.coords.longitude;

          codigoAtual = gerarCodigo();

          await setDoc(doc(db, "aulas", codigoAtual), {

            materia:materia,

            latitude:latitudeProfessor,

            longitude:longitudeProfessor,

            criada:new Date().toLocaleString()
          });

          document.getElementById("info").innerHTML = `
            Matéria: ${materia}
            <br>
            Latitude: ${latitudeProfessor}
            <br>
            Longitude: ${longitudeProfessor}
          `;

          document.getElementById("codigoAula").innerHTML = `
            ${codigoAtual}
          `;

          const link = `
            ${window.location.origin}
            /Engenharia-de-Prompt-IA/unidade_3/aluno.html?codigo=${codigoAtual}
          `;

          document.getElementById("linkAluno").innerHTML = `
            <a href="${link}" target="_blank">
              Abrir página do aluno
            </a>
          `;

          ouvirPresencas();

        },

        ()=>{

          alert("Permita acesso à localização");
        }

      );

    }

    function ouvirPresencas(){

      onSnapshot(

        collection(db, "aulas", codigoAtual, "presencas"),

        (snapshot)=>{

          const lista = document.getElementById("lista");

          lista.innerHTML = "";

          document.getElementById("contador").innerHTML = `
            ${snapshot.size} alunos
          `;

          snapshot.forEach((doc)=>{

            const dados = doc.data();

            lista.innerHTML += `

              <div class="card">

                <strong>
                  ${dados.nome}
                </strong>

                <br>

                Matrícula:
                ${dados.matricula}

                <br>

                Turma:
                ${dados.turma}

                <br>

                Distância:
                ${dados.distancia} metros

                <br>

                ${dados.data}

              </div>

            `;
          });

        }

      );

    }

    window.iniciarAula = iniciarAula;

  </script>

</body>

</html>
